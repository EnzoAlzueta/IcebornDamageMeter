name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test and package without graphics-device tests
        shell: powershell
        run: .\build.ps1 -SkipGraphics
      - uses: actions/upload-artifact@v7
        with:
          name: IceborneDamageMeter-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
