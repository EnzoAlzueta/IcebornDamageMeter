[Overlay]
; auto = MHW's Steam game language. Overrides: en, es, pt-BR, fr, de, it, ja, ko,
; zh-CN, zh-TW, ru, pl, ar. No cambia el idioma del juego.
Language=auto
; Append hunt summaries in the background for future external analysis (0 disables).
; The in-game history still keeps ten hunts. No archive analysis runs in-game.
ArchiveHunts=1
; Show the small DM shortcut when the panel is hidden. F8 works without it.
ShowBadge=1
; 1 = show at quest start; 0 = show only through keys/menu, starting hidden.
AutoShow=1
; 0 top left, 1 top right, 2 bottom right, 3 bottom left
Corner=3
ScalePercent=100
; Escala admitida: 40..175 por ciento. Anchura: 260..640.
Opacity=92
Width=460
MaxRows=4
ShowDamage=1
ShowPercent=1
ShowDps=1
ShowParticipation=1
ShowComparison=1
; Windows key codes: F8, F7, F6, F9. Configurable in Settings.
ShowKey=119
HistoryKey=118
SettingsKey=117
MoveKey=120
; The panel starts hidden and appears when a mission begins.
; F8 toggles visibility. Ctrl+F9 unlocks dragging.
; PositionX and PositionY save relative placement (0..10000) after dragging.
